
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>เว็บของฉัน</title>
  <style>
    body {
      background: #11111b;
      color: white;
      font-family: sans-serif;
      text-align: center;
      padding: 50px 15px;
    }
    .box {
      background: #24243a;
      padding: 25px;
      border-radius: 18px;
      max-width: 400px;
      margin: auto;
    }
    button {
      background: #8b5cf6;
      color: white;
      border: 0;
      padding: 12px 22px;
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>ยินดีต้อนรับ</h1>
    <p>นี่คือเว็บไซต์แรกของฉัน</p>
    <button onclick="alert('เว็บทำงานแล้ว!')">
      กดที่นี่
    </button>
  </div>
</body>
</html>
